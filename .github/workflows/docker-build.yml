# ===== Docker 镜像自动构建与推送 =====
# 当 main 分支有推送时，自动构建后端和前端镜像并推送到 GitHub Container Registry
#
# 触发条件:
#   - push 到 main 分支
#   - 变更文件匹配 Dockerfile* / frontend/ / requirements.txt / src/ / config/
#
# 推送到 GitHub Container Registry (ghcr.io):
#   - ghcr.io/stevenfight/enterprise-rag-agent/backend:latest
#   - ghcr.io/stevenfight/enterprise-rag-agent/frontend:latest

name: Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'frontend/**'
      - 'requirements.txt'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:  # 允许手动触发

env:
  REGISTRY: ghcr.io
  # GHCR 要求镜像名全小写，不能直接用 github.repository（含大写）
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/enterprise-rag-agent/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/enterprise-rag-agent/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 登录 GitHub Container Registry
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 设置 QEMU（多架构支持，可选）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # 4. 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建并推送后端镜像
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. 构建并推送前端镜像
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max