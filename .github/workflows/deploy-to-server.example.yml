# ===== 服务器受控部署 =====
# 当前部署故障尚未完成排查，仅允许手动触发，避免后续推送自动重试失败脚本。
#
# 使用此工作流需要先在 GitHub Secrets 中配置：
#   Settings → Secrets and variables → Actions → New repository secret
#   - SSH_HOST: 服务器 IP 地址
#   - SSH_USER: 服务器用户名
#   - SSH_KEY:  服务器 SSH 私钥内容
#
# 触发条件:
#   - 手动触发
# 自动触发将在服务器、GHCR 凭据和 SHA 镜像部署完成受控验证后恢复。

name: Deploy to Server

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    # 当前仅允许手动受控部署。
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "=== 拉取最新镜像 ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/stevenfight/enterprise-rag-agent/backend:latest
            docker pull ghcr.io/stevenfight/enterprise-rag-agent/frontend:latest
            echo "=== 重启容器 ==="
            cd /opt/enterprise-rag
            docker compose down
            docker compose up -d
            echo "=== 清理旧镜像 ==="
            docker image prune -f
            echo "=== 部署完成 ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep rag
