# 域外关键词过滤规则配置
# 用途: 在 LLM 意图分类之前做第一道规则前置拦截
# 修改此文件后重启服务即可生效，无需改代码

# 是否启用规则前置过滤
enabled: true

# 匹配模式: "reject" = 命中任一规则直接拒绝, "log" = 仅记录日志不拦截
mode: "reject"

# 拒绝时返回的消息 (为空则使用 query_processor 中的默认消息)
reject_message: ""

# ============================================================
# 域外关键词规则 (正则表达式, 命中任一即判定为 out_of_domain)
# ============================================================
out_of_domain_patterns:
  # --- 闲聊 / 天气 ---
  - "天气.*真好|今天.*天气|明天.*天气|下雨|下雪|刮风|台风|气温|多少度"
  - "你吃了吗|吃饭了没|中午吃啥|晚饭.*什么"

  # --- 娱乐 ---
  - "讲个?笑话|说个?笑话|.*笑话.*给我|段子"
  - "推荐.*电影|.*电影.*推荐|有什么.*电影|好看的.*剧"
  - "推荐.*歌|唱.*歌|.*首歌|.*歌词|有什么.*歌"
  - "推荐.*游戏|有什么.*游戏|好玩.*游戏"

  # --- 生活 / 烹饪 ---
  - "做[饭菜]|菜谱|烹饪|红烧|清蒸|炒.*怎么|怎么做.*菜"
  - "查.*快递|.*快递.*到哪|物流.*查询"
  - "订.*票|买.*票|火车票|飞机票|高铁票"

  # --- 编程 / 翻译 / 设计 (非财务类的技术请求) ---
  - "帮我写.*代码|帮我.*编程|帮我.*debug|教我.*编程"
  - "翻译.*成.*|translate.*to"
  - "画.*图|生成.*图片|做.*PPT|P.*图"

  # --- 占卜 / 星座 ---
  - "算.*命|(星座|白羊|摩羯|双子|巨蟹|狮子|处女|天秤|天蝎|射手|水瓶|双鱼|.*座).*运势|今日运势|占卜|风水|塔罗|手相|面相"

  # --- 故事 / 闲聊 ---
  - "讲.*故事|童话|睡前故事|从前有"
  - "你是谁|你叫.*名字|你的.*名字|.*是谁"

  # --- 人身攻击 / 辱骂 / 违规内容 ---
  - "傻[逼Xx叉屄]|脑[残瘫]|白痴|弱智|智[障章]|神经病"
  - "[去滚]死|.*他妈.*|.*你妈.*|.*你爹.*|[操草艹].*妈"
  - "[草操艹日肏](你|尼|拟|伱|[他她它牠]|.*全家)"
  - "畜[生牲]|杂[种]|狗[日的娘东西]|贱[人货种]"
  - "[肏操]|婊[子]|烂[货人]|骚[货]|浪[货]"
  - "^[Nn][Mm][Ss][Ll]$|nmsl|NMSL"

  # --- 色情 / 违规 ---
  - "[色黄]情|裸[照体]|约[炮Pp]|一夜情|援交|嫖|卖淫"
  - "[鸡JI]女|小[姐姐].*出台|特殊服务|按摩.*服务"
  - "[开搞]黄|涉黄|sq|SQ|福利姬"

  # --- 政治敏感 ---
  - "[习近]主席|习[大大]|※|六四|天安门.*事件|fa[lL][uU]n|FLG"

  # --- 其他明显域外查询 ---
  - "[陪代]聊|情感.*咨询|分手|复合|恋爱.*技巧"

# ============================================================
# 安全内容规则 (命中则标记为 unsafe_content, 返回安全警告)
# ============================================================
unsafe_content_patterns:
  # --- 提示词注入 ---
  - "忽略.*(指令|规则|之前.*|所有)|忘记.*规则|你现在是|你的新角色是"
  - "(system|System|SYSTEM)\\s*:|<\\|im_start\\|>|<\\|system\\|>"
  - "输出.*system.?prompt|show.*system.?prompt|打印.*prompt"
  - "(DAN|dan)\\s*(mode|模式)|越狱|jail[ -]?break"

  # --- 重复刷屏 ---
  - "(.)\\1{20,}"  # 同一字符连续重复超过20次
