<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: white; }
    .subtitle { font-size: 11px; font-weight: 600; fill: white; }
    .label { font-size: 10px; font-weight: 500; fill: #e2e8f0; }
    .desc { font-size: 9px; fill: #94a3b8; }
    .warn { font-size: 9px; fill: #fbbf24; }
    .step-num { font-size: 12px; font-weight: 700; }
    .step-title { font-size: 10px; font-weight: 600; fill: white; }
    .step-desc { font-size: 8px; fill: #cbd5e1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">RAG 检索层面 vs CompareTool 工具层面 — "保底"概念对比</text>

  <!-- Left Region: RAG Retrieval Layer -->
  <rect x="30" y="50" width="390" height="360" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="50" y="72" fill="#22d3ee" font-size="10" font-weight="600">RAG 检索层面 · HybridRetriever / 检索管道</text>

  <!-- Retrieval steps -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="350" height="55" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#22d3ee">①</text>
    <text x="45" y="22" class="step-title">公平分配</text>
    <text x="45" y="38" class="step-desc">将检索配额按公司数均分，避免某家公司独占 top_k</text>
  </g>

  <g transform="translate(50, 155)">
    <rect x="0" y="0" width="350" height="55" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#22d3ee">②</text>
    <text x="45" y="22" class="step-title">替换策略</text>
    <text x="45" y="38" class="step-desc">某家公司无结果时，用该公司的其他可用 chunk 替换</text>
  </g>

  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="350" height="55" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#22d3ee">③</text>
    <text x="45" y="22" class="step-title">保底重新检索</text>
    <text x="45" y="38" class="step-desc">放宽条件再次检索，命中同公司其他段落</text>
  </g>

  <g transform="translate(50, 285)">
    <rect x="0" y="0" width="350" height="55" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#22d3ee">④</text>
    <text x="45" y="22" class="step-title">营收数据保底补充</text>
    <text x="45" y="38" class="step-desc">从全文摘要中提取营收数据，确保核心指标不缺失</text>
  </g>

  <text x="50" y="365" class="subtitle" fill="#22d3ee">四层保底</text>
  <text x="120" y="365" class="desc">发生在检索阶段，解决"能不能搜到多公司数据"</text>

  <!-- Right Region: CompareTool Layer -->
  <rect x="460" y="50" width="390" height="360" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="480" y="72" fill="#fbbf24" font-size="10" font-weight="600">CompareTool 工具层面 · Agent 工具执行</text>

  <!-- Tool steps -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="350" height="70" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#fbbf24">①</text>
    <text x="45" y="22" class="step-title">指定 company_name 检索</text>
    <text x="45" y="38" class="step-desc">按用户输入的公司名精确检索</text>
    <text x="45" y="52" class="step-desc">→ 部分公司可能无结果</text>
  </g>

  <g transform="translate(480, 185)">
    <rect x="0" y="0" width="350" height="70" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#fbbf24">②</text>
    <text x="45" y="22" class="step-title">不限公司名重新检索</text>
    <text x="45" y="38" class="step-desc">去掉 company 过滤，扩大检索范围</text>
    <text x="45" y="52" class="step-desc">→ 可能命中其他公司的报告</text>
  </g>

  <g transform="translate(480, 270)">
    <rect x="0" y="0" width="350" height="70" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="350" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="22" class="step-num" fill="#fbbf24">③</text>
    <text x="45" y="22" class="step-title">标记"数据缺失"</text>
    <text x="45" y="38" class="step-desc">经保底检索仍无法获取</text>
    <text x="45" y="52" class="step-desc">→ 在对比表中明确标注 N/A</text>
  </g>

  <text x="480" y="365" class="subtitle" fill="#fbbf24">三层保底</text>
  <text x="560" y="365" class="desc">发生在工具执行阶段，解决"对比表如何优雅处理缺失"</text>

  <!-- Confusion Area (Bottom) -->
  <rect x="30" y="430" width="820" height="70" rx="8" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="50" y="450" fill="#fb7185" font-size="10" font-weight="600">为什么容易混淆？</text>

  <text x="50" y="470" class="warn">① 两者都围绕"多公司对比"场景</text>
  <text x="260" y="470" class="warn">② 两者都涉及"数据缺失时的兜底检索"</text>
  <text x="490" y="470" class="warn">③ 两者名称都叫"X层保底"</text>
  <text x="50" y="488" class="warn">④ 检索层面的④包含"重新检索"，工具层面的②也叫"重新检索" —— 动作相似但层级完全不同</text>

  <!-- Key distinction -->
  <text x="50" y="410" fill="#34d399" font-size="10" font-weight="600">关键区分：检索层面的保底在 HybridRetriever 中，决定"搜不搜得到"；工具层面的保底在 CompareTool.run() 中，决定"对比表怎么填"</text>
</svg>