  <rect x="935" y="276" width="220" height="38" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1"/>
  <text x="1045" y="297" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">gte-rerank-v2 · 重排</text>

