# ===== Docker Compose 编排文件 =====
# 一条命令启动整个系统: docker compose up

version: "3.8"

services:
  # ==================== 后端: FastAPI ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"          # 映射 FastAPI 端口（调试时可单独访问）
    volumes:
      # 数据挂载：向量索引、PDF、图表等从宿主机映射进容器
      - ./data:/app/data
      # 配置挂载：bm25 词典、agent 配置等
      - ./config:/app/config
    env_file:
      - .env.docker          # 加载环境变量（API Key 等）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s      # 启动后等 60 秒再开始健康检查（模型加载需要时间）
    networks:
      - rag-network

  # ==================== 前端: Nginx ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "80:80"              # 用户浏览器访问 http://localhost
    depends_on:
      - backend               # 确保后端先启动
    networks:
      - rag-network

# ==================== 网络 ====================
networks:
  rag-network:
    driver: bridge
